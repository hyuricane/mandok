image: docker:dind
services:
  - docker:dind

stages:
  - build
  - release

dockerize:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

package-installer:
  stage: release
  when: manual
  image: golang:1.24
  script:
    - mkdir -p dist
    - CGO_ENABLED=0 GOOS=linux go build -o dist/mandok main.go
    - tar -czf mandok-installer.tar.gz dist/mandok install.sh uninstall.sh mandok.service env.example sample.env
  artifacts:
    paths:
      - mandok-installer.tar.gz
    expire_in: 1 week